<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Customer Churn Prediction</h1>
        <form id="predictionForm">
            <div class="form-grid">
                <!-- Customer Information -->
                <div class="form-section">
                    <h2>Customer Information</h2>
                    <div class="form-group">
                        <label>State (Abbreviation):</label>
                        <input type="text" name="State" pattern="[A-Z]{2}" title="2-letter state code" required 
                               placeholder="e.g., LA" value="LA">
                    </div>
                    <div class="form-group">
                        <label>Account Length (months):</label>
                        <input type="number" name="Account length" min="0" required 
                               value="117">
                    </div>
                    <div class="form-group">
                        <label>Area Code:</label>
                        <input type="number" name="Area code" min="100" max="999" required 
                               value="408">
                    </div>
                </div>

                <!-- Plan Information -->
                <div class="form-section">
                    <h2>Plan Details</h2>
                    <div class="form-group">
                        <label>International Plan:</label>
                        <select name="International plan" required>
                            <option value="no" selected>No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Voice Mail Plan:</label>
                        <select name="Voice mail plan" required>
                            <option value="no" selected>No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Number of Voicemails:</label>
                        <input type="number" name="Number vmail messages" min="0" required 
                               value="0">
                    </div>
                </div>

                <!-- Service Usage -->
                <div class="form-section">
                    <h2>Service Usage</h2>
                    
                    <!-- Day Usage -->
                    <div class="form-group">
                        <label>Day Minutes:</label>
                        <input type="number" step="0.1" name="Total day minutes" required 
                               value="184.5">
                    </div>
                    <div class="form-group">
                        <label>Day Calls:</label>
                        <input type="number" name="Total day calls" min="0" required 
                               value="97">
                    </div>
                    <div class="form-group">
                        <label>Day Charge ($):</label>
                        <input type="number" step="0.01" name="Total day charge" required 
                               value="31.37">
                    </div>

                    <!-- Evening Usage -->
                    <div class="form-group">
                        <label>Evening Minutes:</label>
                        <input type="number" step="0.1" name="Total eve minutes" required 
                               value="351.6">
                    </div>
                    <div class="form-group">
                        <label>Evening Calls:</label>
                        <input type="number" name="Total eve calls" min="0" required 
                               value="80">
                    </div>
                    <div class="form-group">
                        <label>Evening Charge ($):</label>
                        <input type="number" step="0.01" name="Total eve charge" required 
                               value="29.89">
                    </div>

                    <!-- Night Usage -->
                    <div class="form-group">
                        <label>Night Minutes:</label>
                        <input type="number" step="0.1" name="Total night minutes" required 
                               value="215.8">
                    </div>
                    <div class="form-group">
                        <label>Night Calls:</label>
                        <input type="number" name="Total night calls" min="0" required 
                               value="90">
                    </div>
                    <div class="form-group">
                        <label>Night Charge ($):</label>
                        <input type="number" step="0.01" name="Total night charge" required 
                               value="9.71">
                    </div>

                    <!-- International Usage -->
                    <div class="form-group">
                        <label>International Minutes:</label>
                        <input type="number" step="0.1" name="Total intl minutes" required 
                               value="8.7">
                    </div>
                    <div class="form-group">
                        <label>International Calls:</label>
                        <input type="number" name="Total intl calls" min="0" required 
                               value="4">
                    </div>
                    <div class="form-group">
                        <label>International Charge ($):</label>
                        <input type="number" step="0.01" name="Total intl charge" required 
                               value="2.35">
                    </div>

                    <!-- Customer Service -->
                    <div class="form-group">
                        <label>Customer Service Calls:</label>
                        <input type="number" name="Customer service calls" min="0" required 
                               value="1">
                    </div>
                </div>
            </div>

            <button type="submit">Predict Churn</button>
        </form>

        <div id="result" class="hidden">
            <h2>Prediction Result</h2>
            <p id="predictionText"></p>
        </div>

        <div id="loading" class="hidden">
            <div class="loader"></div>
            <p>Analyzing data...</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('predictionForm');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        const predictionText = document.getElementById('predictionText');

        const API_URL = "{{ api_url }}";

        // List of numeric fields that need conversion
        const numericFields = [
            'Account length', 'Area code', 'Number vmail messages',
            'Total day minutes', 'Total day calls', 'Total day charge',
            'Total eve minutes', 'Total eve calls', 'Total eve charge',
            'Total night minutes', 'Total night calls', 'Total night charge',
            'Total intl minutes', 'Total intl calls', 'Total intl charge',
            'Customer service calls'
        ];

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            loadingDiv.classList.remove('hidden');
            resultDiv.classList.add('hidden');

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Convert numeric fields to numbers
            numericFields.forEach(field => {
                if (data[field]) data[field] = parseFloat(data[field]);
            });

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Prediction failed');
                }
                
                const result = await response.json();
                predictionText.textContent = result.churn_prediction
                    ? "High Churn Risk"
                    : "Low Churn Risk";
                
                resultDiv.classList.remove('hidden');
            } catch (error) {
                predictionText.textContent = `Error: ${error.message}`;
                resultDiv.classList.remove('hidden');
            } finally {
                loadingDiv.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
