name: ML Pipeline with MLflow and Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create MLruns Directory
        run: mkdir -p mlruns

      - name: Start MLflow Server with SQLite Backend
        run: |
          nohup mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root file://$(pwd)/mlruns \
            --host 0.0.0.0 \
            --port 5002 & 
          sleep 10

      - name: Start app.py on port 5000
        run: |
          nohup uvicorn app:app --host 0.0.0.0 --port 5000 & 
          sleep 5

      - name: Start app1.py on port 5001
        run: |
          nohup uvicorn app1:app --host 0.0.0.0 --port 5001 & 
          sleep 5

      - name: Run Training
        run: make train

      - name: Upload MLflow Logs
        uses: actions/upload-artifact@v3
        with:
          name: mlruns
          path: mlruns/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: |
          docker build -t my-ml-app .

      - name: Run Docker Container
        run: |
          docker run -d --name ml_app -p 5000:5000 -p 5001:5001 -p 5002:5002 my-ml-app

      - name: Wait for Services to Start
        run: sleep 15
