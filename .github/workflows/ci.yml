name: Customer Churn MLOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data
        run: make prepare

      - name: Train model
        run: make train

      - name: Evaluate model
        run: make evaluate

      - name: Smoke test project files
        run: python tests/test_environment.py

      - name: Build Docker image
        run: docker build -t churn-prediction-app .
